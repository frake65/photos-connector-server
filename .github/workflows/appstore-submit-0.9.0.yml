name: Submit 0.9.0 to Nextcloud App Store

on:
  workflow_dispatch:

jobs:
  submit:
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Verify immutable GitHub release asset
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/frake65/photos-connector-server/releases/download/v0.9.0/apple_photos_connector-0.9.0-signed.tar.gz'
          curl --fail --silent --show-error --location "$url" --output /tmp/apple_photos_connector-0.9.0-signed.tar.gz
          echo '8ff858e2c6f69305129486e7b1c0e94bda55ac4021c9b09aee181be0e0eed47d  /tmp/apple_photos_connector-0.9.0-signed.tar.gz' | sha256sum --check

      - name: Submit release to Nextcloud App Store
        shell: bash
        env:
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$APPSTORE_TOKEN"
          response=$(mktemp)
          status=$(curl --silent --show-error --location --output "$response" --write-out '%{http_code}' \
            --request POST 'https://apps.nextcloud.com/api/v1/apps/releases' \
            --header 'Authorization: Token '"$APPSTORE_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-raw '{"download":"https://github.com/frake65/photos-connector-server/releases/download/v0.9.0/apple_photos_connector-0.9.0-signed.tar.gz","signature":"","nightly":false}')
          echo "HTTP status: $status"
          if [[ "$status" != 200 && "$status" != 201 ]]; then
            sed -E 's/(token|signature|password|secret)[^,}]*/<redacted>/Ig' "$response"
            exit 1
          fi
          sed -E 's/(token|signature|password|secret)[^,}]*/<redacted>/Ig' "$response"
