<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Photos Connector</title>
  <desc id="desc">Ein neutrales Foto-Symbol mit Upload-Pfeil vor einer Wolke.</desc>

  <!-- Monochrome, brand-neutral app icon: no Apple or Nextcloud logo geometry. -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="#000"/>

  <!-- Neutral cloud outline, raised so the upload arrow ends inside it. -->
  <g transform="translate(0 -42)">
    <path d="M120 294h106 M286 294h104c31 0 56-25 56-56s-25-56-56-56h-8c-8-45-47-79-94-79-36 0-68 20-84 51-7-3-15-5-24-5-30 0-55 24-55 54 0 6 1 12 3 18h-8c-25 0-45 20-45 45s20 45 45 45" fill="none" stroke="#fff" stroke-width="24" stroke-linejoin="round"/>
  </g>

  <!-- The arrow tip sits at the cloud's visual center; its tail starts above the photo. -->
  <path d="M256 286V170m0 0-42 42m42-42 42 42" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Photo card with abstract, non-branded landscape. -->
  <g transform="rotate(-6 256 417)">
    <rect x="126" y="309" width="260" height="170" rx="24" fill="#fff" stroke="#000" stroke-width="16"/>
    <rect x="151" y="334" width="210" height="120" rx="10" fill="#000"/>
    <circle cx="313" cy="368" r="16" fill="#fff"/>
    <path d="m151 425 54-54 37 35 31-27 88 75H161c-6 0-10-5-10-11v-18Z" fill="#fff"/>
    <path d="m151 440 53-36 38 29 27-20 92 60H161c-6 0-10-5-10-11v-22Z" fill="#000"/>
  </g>
</svg>
